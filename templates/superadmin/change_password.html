{% extends 'superadmin/base.html' %} {% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow border-0" style="border-radius: 12px;">
                <div class="card-header bg-dark text-white text-center py-3" style="border-top-left-radius: 12px; border-top-right-radius: 12px;">
                    <h5 class="mb-0"><i class="fas fa-key me-2"></i>Superadmin Şifre Değiştir</h5>
                </div>
                <div class="card-body p-4">
                    {% with messages = get_flashed_messages(with_categories=true) %}
                        {% if messages %}
                            {% for category, message in messages %}
                                <div class="alert alert-{{ 'danger' if category == 'error' else category }} alert-dismissible fade show" role="alert">
                                    {{ message }}
                                </div>
                            {% endfor %}
                        {% endif %}
                    {% endwith %}

                    <form action="{{ url_for('sa_sifre_degistir') }}" method="POST">
                        <div class="mb-3">
                            <label class="form-label text-secondary fw-semibold">Mevcut Şifre</label>
                            <input type="password" class="form-control" name="current_password" required placeholder="Şu anki şifrenizi girin">
                        </div>
                        <hr class="text-muted my-4">
                        <div class="mb-3">
                            <label class="form-label text-secondary fw-semibold">Yeni Şifre</label>
                            <input type="password" class="form-control" name="new_password" required placeholder="En az 6 karakter girin">
                        </div>
                        <div class="mb-4">
                            <label class="form-label text-secondary fw-semibold">Yeni Şifre (Tekrar)</label>
                            <input type="password" class="form-control" name="confirm_password" required placeholder="Yeni şifreyi tekrar yazın">
                        </div>
                        
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-success py-2 fw-semibold">Şifreyi Güncelle</button>
                            <a href="{{ url_for('sa_panel') }}" class="btn btn-light py-2 text-secondary">İptal Et</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
